; hd-res: HD resolution for the v84 client. Goes next to hd-res-1.0.0.dll in edits\.
; Only even values. The patch table is fitted as value = aW*W/2 + aH*H/2 + aWH*W*H + k,
; so odd numbers truncate the halves and put the UI half a pixel out.
[general]
width=1280
height=720
; report=1 shows a message box with applied/skipped/byte-mismatch counts at startup.
; Use it on the first launch: a non-zero byte-mismatch means this client is not the
; build the patch table was verified against, and those rows were skipped, not applied.
; Counts always go to OutputDebugStringA regardless of this setting.
report=0
