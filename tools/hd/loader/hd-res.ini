; hd-res: HD resolution for the v84 client. Sits next to hd-res-2.1.0.dll in edits\.
;
; config.ini at the CLIENT ROOT (next to MapleStory.exe) is read AFTER this file and
; overrides width/height. Edit that one -- it is the same file Ezorsia itself reads, so
; there is one config to maintain. This file supplies the fallback if config.ini is
; missing, plus the two debug knobs below, which config.ini has no keys for.
;
; Only even values. The patch table is fitted as value = aW*W/2 + aH*H/2 + aWH*W*H + k,
; so odd numbers truncate the halves and put the UI half a pixel out.
[general]
width=1280
height=720

; report=1 shows a message box with the patch counts at startup. Leave it on for the
; first launch -- it is the whole verification, and it costs one OK click.
report=1

; diag=0 installs NO hooks at all. This is the shipping setting.
;
; diag=1 was built to log IWzNameSpace::GetItem calls and settle whether the client's
; namespace path strings are length-prefixed bstrs. That question has since been
; answered from the disassembly instead: the pointer pushed at 0x00A405CB feeds
; Ztl_bstr_t's constructor at 0x00403382, which COPIES, so the string the client frees
; is always its own allocation. The log would teach us nothing further, and every hook
; that is live is a hook that can be blamed for the next crash. Leave this at 0.
diag=0
