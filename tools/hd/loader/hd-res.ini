; hd-res: HD resolution for the v84 client. Goes next to hd-res-2.1.0.dll in edits\.
;
; Ezorsia's config.ini at the client root (next to MapleStory.exe) is read after this
; file and overrides width/height. Keep editing that one; this file supplies defaults
; if it is missing, plus the two debug knobs below, which Ezorsia has no keys for.
;
; Only even values. The patch table is fitted as value = aW*W/2 + aH*H/2 + aWH*W*H + k,
; so odd numbers truncate the halves and put the UI half a pixel out.
[general]
width=1280
height=720

; report=1 shows a message box with the counts at startup.
report=1

; ---------------------------------------------------------------------------
; diag=1 is what THIS build is for.
;
; It installs a READ-ONLY observer on IWzNameSpace::GetItem and writes every namespace
; lookup to hd-res-diag.log in this folder. It swaps nothing, redirects nothing and
; loads no archive -- the DLL applies the same 288 resolution patches it always did and
; otherwise only watches. That is why it is safe to launch.
;
; diag=0 installs no hooks whatsoever, i.e. exactly the v1.0.0 behaviour.
;
; The log answers the question that crashed v2.0.0: what the client actually asks the
; namespace for, in what order, and how its path strings are really represented. A
; "call" line with no matching "ret" line is a lookup that threw.
diag=1
