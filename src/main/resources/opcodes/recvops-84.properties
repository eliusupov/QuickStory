# The summon block is +5 like the pet block above it, not +3. Ticket 33 read it off the client's
# own COutPacket::COutPacket(nType) call sites (ctor v83 0x006EC9CE / v84 0x00703CFA):
#   MOVE_SUMMON    v83 0x009C8523 push 0xAF <-> v84 0x00A0FDC3 push 0xB4  (bodies byte-identical)
#   DAMAGE_SUMMON  v83 0x007A627A push 0xB1 <-> v84 0x007CBD30 push 0xB6  (bodies byte-identical)
#   BEHOLDER       v83 0x007A5BED push 0xB2 <-> v84 0x007CB6A3 push 0xB7  (same +0x25AB6 delta)
# SUMMON_ATTACK uses the sized COutPacket overload, like the other attack packets, so it has no
# site in that scan - but it is bracketed by two proven neighbours and 0xB5 is the only value left.
