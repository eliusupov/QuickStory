# The ItemUI block is +7, resolved off the client's COutPacket ctor sites (ticket 33). Every pair
# below is the same function body in both images, differing only in the pushed nType:
#   OPEN_ITEMUI   v83 0x0089124E push 0xEC <-> v84 0x008C536B push 0xF3
#   CLOSE_ITEMUI  v83 0x00890EAA push 0xED <-> v84 0x008C4FC7 push 0xF4  (both sites, delta 0x3411D)
#   USE_ITEMUI    v83 0x008913CF push 0xEE <-> v84 0x008C6854 push 0xF5
# atlas says 0xEC/0xED/0xEE here, which is just its stale v83 value - its own COUPON_CODE was
# reshifted to 0xEC, so its registry collides with itself on that row.
